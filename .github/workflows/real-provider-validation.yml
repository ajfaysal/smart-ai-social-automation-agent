name: Real Provider Validation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider profile to validate
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - demucs
          - mediapipe
          - wav2lip
          - whisper
          - xtts-v2
      runner_label:
        description: GitHub runner label with provisioned provider dependencies/media
        required: true
        default: ubuntu-latest
        type: string
      media_path:
        description: Runner-local media path (audio for Demucs, image for MediaPipe, video for Wav2Lip)
        required: false
        default: ''
        type: string
      audio_path:
        description: Runner-local audio path for Wav2Lip
        required: false
        default: ''
        type: string
      output_path:
        description: Runner-local output path for Wav2Lip or XTTS-v2
        required: false
        default: 'provider-validation-work/wav2lip-output.mp4'
        type: string
      text_path:
        description: Runner-local UTF-8 dialogue text for XTTS-v2
        required: false
        default: ''
        type: string
      reference_path:
        description: Runner-local character reference audio for XTTS-v2
        required: false
        default: ''
        type: string
      language:
        description: Target language for XTTS-v2
        required: false
        default: bn
        type: string

jobs:
  validate:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Record runner selection
        run: |
          mkdir -p validation-artifacts
          printf 'runner_label=%s\nprovider=%s\n' '${{ inputs.runner_label }}' '${{ inputs.provider }}' > validation-artifacts/runner-profile.txt
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install credential-free validation dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deterministic contract tests
        run: pytest -q test_real_provider_validation.py test_provider_reliability.py test_provider_runtime.py test_provider_media_validation.py test_real_whisper_xtts_runner.py
      - name: Run dry-run profile
        if: inputs.provider == 'dry-run'
        run: |
          mkdir -p validation-artifacts
          printf 'selected_provider=dry-run\nstatus=contract-tests-only\n' > validation-artifacts/profile.txt
      - name: Preflight Whisper input
        if: inputs.provider == 'whisper'
        env:
          MEDIA_PATH: ${{ inputs.media_path }}
          WHISPER_LOCAL_COMMAND: ${{ secrets.WHISPER_LOCAL_COMMAND }}
        run: |
          test -n "$MEDIA_PATH" || { echo 'media_path is required for whisper'; exit 2; }
          test -f "$MEDIA_PATH" || { echo "Whisper audio does not exist: $MEDIA_PATH"; exit 2; }
          test -n "$WHISPER_LOCAL_COMMAND" || { echo 'WHISPER_LOCAL_COMMAND must be configured on the selected runner'; exit 2; }
          mkdir -p validation-artifacts provider-validation-work
      - name: Run Whisper large-v3 production profile
        if: inputs.provider == 'whisper'
        env:
          MEDIA_PATH: ${{ inputs.media_path }}
          WHISPER_LOCAL_COMMAND: ${{ secrets.WHISPER_LOCAL_COMMAND }}
          DUBBING_STT_MODEL: large-v3
          DUBBING_STT_PROVIDER: local-whisper
        run: python real_provider_runner.py whisper --audio "$MEDIA_PATH" --work provider-validation-work > validation-artifacts/validation.json
      - name: Preflight XTTS-v2 inputs
        if: inputs.provider == 'xtts-v2'
        env:
          TEXT_PATH: ${{ inputs.text_path }}
          REFERENCE_PATH: ${{ inputs.reference_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          XTTS_V2_TTS_COMMAND: ${{ secrets.XTTS_V2_TTS_COMMAND }}
        run: |
          test -n "$TEXT_PATH" || { echo 'text_path is required for xtts-v2'; exit 2; }
          test -f "$TEXT_PATH" || { echo "XTTS text file does not exist: $TEXT_PATH"; exit 2; }
          test -n "$REFERENCE_PATH" || { echo 'reference_path is required for xtts-v2'; exit 2; }
          test -f "$REFERENCE_PATH" || { echo "XTTS reference audio does not exist: $REFERENCE_PATH"; exit 2; }
          test -n "$OUTPUT_PATH" || { echo 'output_path is required for xtts-v2'; exit 2; }
          test -n "$XTTS_V2_TTS_COMMAND" || { echo 'XTTS_V2_TTS_COMMAND must be configured on the selected runner'; exit 2; }
          mkdir -p validation-artifacts provider-validation-work "$(dirname "$OUTPUT_PATH")"
      - name: Run XTTS-v2 production profile
        if: inputs.provider == 'xtts-v2'
        env:
          TEXT_PATH: ${{ inputs.text_path }}
          REFERENCE_PATH: ${{ inputs.reference_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          LANGUAGE: ${{ inputs.language }}
          XTTS_V2_TTS_COMMAND: ${{ secrets.XTTS_V2_TTS_COMMAND }}
          REQUIRE_REFERENCE_VOICE_CLONING: 'true'
        run: python real_provider_runner.py xtts-v2 --text "$TEXT_PATH" --reference "$REFERENCE_PATH" --output "$OUTPUT_PATH" --language "$LANGUAGE" > validation-artifacts/validation.json
      - name: Preflight Demucs input
        if: inputs.provider == 'demucs'
        env:
          MEDIA_PATH: ${{ inputs.media_path }}
        run: |
          test -n "$MEDIA_PATH" || { echo 'media_path is required for demucs'; exit 2; }
          test -f "$MEDIA_PATH" || { echo "Demucs input file does not exist: $MEDIA_PATH"; exit 2; }
          mkdir -p validation-artifacts provider-validation-work
      - name: Run Demucs production profile
        if: inputs.provider == 'demucs'
        env:
          MEDIA_PATH: ${{ inputs.media_path }}
        run: python real_provider_runner.py demucs --audio "$MEDIA_PATH" --work provider-validation-work > validation-artifacts/validation.json
      - name: Preflight MediaPipe input
        if: inputs.provider == 'mediapipe'
        env:
          MEDIA_PATH: ${{ inputs.media_path }}
        run: |
          test -n "$MEDIA_PATH" || { echo 'media_path is required for mediapipe'; exit 2; }
          test -f "$MEDIA_PATH" || { echo "MediaPipe input image does not exist: $MEDIA_PATH"; exit 2; }
          mkdir -p validation-artifacts provider-validation-work
      - name: Run MediaPipe production profile
        if: inputs.provider == 'mediapipe'
        env:
          MEDIA_PATH: ${{ inputs.media_path }}
        run: MOUTH_LANDMARK_PROVIDER=mediapipe python real_provider_runner.py mediapipe --image "$MEDIA_PATH" > validation-artifacts/validation.json
      - name: Preflight Wav2Lip inputs
        if: inputs.provider == 'wav2lip'
        env:
          VIDEO_PATH: ${{ inputs.media_path }}
          AUDIO_PATH: ${{ inputs.audio_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          test -n "$VIDEO_PATH" || { echo 'media_path is required for wav2lip video'; exit 2; }
          test -f "$VIDEO_PATH" || { echo "Wav2Lip video does not exist: $VIDEO_PATH"; exit 2; }
          test -n "$AUDIO_PATH" || { echo 'audio_path is required for wav2lip'; exit 2; }
          test -f "$AUDIO_PATH" || { echo "Wav2Lip audio does not exist: $AUDIO_PATH"; exit 2; }
          test -n "$OUTPUT_PATH" || { echo 'output_path is required for wav2lip'; exit 2; }
          mkdir -p validation-artifacts provider-validation-work "$(dirname "$OUTPUT_PATH")"
      - name: Run Wav2Lip production profile
        if: inputs.provider == 'wav2lip'
        env:
          VIDEO_PATH: ${{ inputs.media_path }}
          AUDIO_PATH: ${{ inputs.audio_path }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          LIPSYNC_PROVIDER: wav2lip
        run: python real_provider_runner.py wav2lip --video "$VIDEO_PATH" --audio "$AUDIO_PATH" --output "$OUTPUT_PATH" > validation-artifacts/validation.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-provider-validation-${{ inputs.provider }}
          path: |
            validation-artifacts/
            provider-validation-work/
          if-no-files-found: error
