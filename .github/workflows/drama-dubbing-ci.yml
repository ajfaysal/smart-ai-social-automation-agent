name: Drama Dubbing CI

on:
  push:
    branches: [main, feature/drama-dubbing-tool]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile drama_dubbing.py music_engine.py lip_sync.py lip_sync_provider.py lip_sync_qc.py scene_analysis.py lip_sync_router.py
      - name: Import check
        run: |
          python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart requests numpy
          python -c "import drama_dubbing, music_engine, lip_sync, lip_sync_provider, lip_sync_qc, scene_analysis, lip_sync_router; print('DubStudio modules import successfully')"
      - name: Lip-sync smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from lip_sync import build_lip_sync_plan
          from lip_sync_provider import get_lip_sync_provider
          manifest = [{"index": 1, "character": "C1", "start": 0.0, "end": 1.0, "translation": "Hello", "emotion": "neutral"}]
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "plan.json"
              build_lip_sync_plan(manifest, p)
              assert p.exists() and 'visemes' in p.read_text()
          assert get_lip_sync_provider().name == 'disabled'
          print('Lip-sync preparation smoke test passed')
          PY
