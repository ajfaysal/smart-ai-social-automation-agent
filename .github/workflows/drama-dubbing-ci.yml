name: Drama Dubbing CI

on:
  push:
    branches: [main, feature/drama-dubbing-tool, feature/e2e-dubbing-integration]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart requests numpy opencv-python-headless pytest
      - name: Syntax check
        run: python -m py_compile drama_dubbing.py music_engine.py lip_sync.py lip_sync_provider.py lip_sync_qc.py scene_analysis.py scene_aware_pipeline.py lip_sync_router.py face_detector.py face_validation.py face_tracking.py mouth_validation.py landmark_provider.py shot_lipsync.py shot_qc.py provider_runtime.py provider_reliability.py demucs_provider.py test_dubbing_integration.py test_provider_runtime.py test_provider_runtime_extra.py test_demucs_provider.py kaggle_full_pipeline.py kaggle_gpu_orchestrator.py v1_scope.py real_run_preflight.py tests/test_kaggle_full_pipeline.py tests/test_character_voice_routing.py tests/character_voice_profile_contract.py tests/test_bangla_quality_pipeline.py tests/test_kaggle_gpu_orchestrator.py tests/test_v1_scope.py tests/test_real_run_preflight.py
      - name: Import check
        run: |
          python - <<'PY'
          import drama_dubbing, music_engine, lip_sync, lip_sync_provider, lip_sync_qc
          import scene_analysis, scene_aware_pipeline, lip_sync_router
          import face_detector, face_validation, face_tracking, mouth_validation, landmark_provider
          import shot_lipsync, shot_qc, provider_runtime, provider_reliability, demucs_provider
          import kaggle_full_pipeline, kaggle_gpu_orchestrator, tts_provider, v1_scope, real_run_preflight
          print('DubStudio modules import successfully')
          PY
      - name: Lip-sync and routing smoke tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tempfile
          from lip_sync import build_lip_sync_plan
          from lip_sync_provider import get_lip_sync_provider
          from landmark_provider import get_landmark_provider
          from face_tracking import tracking_eligibility
          manifest = [{"index": 1, "character": "C1", "start": 0.0, "end": 1.0, "translation": "Hello", "emotion": "neutral"}]
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "plan.json"
              build_lip_sync_plan(manifest, p)
              assert p.exists() and 'visemes' in p.read_text()
          os.environ.pop('MOUTH_LANDMARK_PROVIDER', None)
          os.environ.pop('LANDMARK_PROVIDER', None)
          assert get_lip_sync_provider().name == 'disabled'
          assert get_landmark_provider().name == 'disabled'
          ok, reason = tracking_eligibility([], 'disabled')
          assert not ok and 'landmark' in reason.lower()
          records = [{"face_suitable": True, "mouth_visible": True, "track_stable": True} for _ in range(5)]
          ok, _ = tracking_eligibility(records, 'disabled')
          assert not ok
          print('Lip-sync routing smoke tests passed')
          PY
      - name: Provider reliability tests
        run: python -m pytest -q test_provider_runtime.py test_provider_runtime_extra.py test_demucs_provider.py
      - name: Voice profile tests
        run: python -m pytest -q tests/test_character_voice_routing.py tests/character_voice_profile_contract.py tests/test_bangla_quality_pipeline.py tests/test_kaggle_gpu_orchestrator.py tests/test_v1_scope.py tests/test_real_run_preflight.py
      - name: Shot QC tests
        run: python test_shot_qc.py
      - name: End-to-end dubbing integration test
        run: python -m pytest -q test_dubbing_integration.py
      - name: Kaggle pipeline contract tests
        run: python -m pytest -q tests/test_kaggle_full_pipeline.py
