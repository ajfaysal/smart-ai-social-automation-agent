name: Drama Dubbing CI

on:
  push:
    branches: [main, feature/drama-dubbing-tool]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile drama_dubbing.py music_engine.py lip_sync.py
      - name: Import check
        run: |
          python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart requests numpy
          python -c "import drama_dubbing, music_engine, lip_sync; print('DubStudio modules import successfully')"
      - name: Lip-sync plan smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from lip_sync import build_lip_sync_plan
          out = Path('/tmp/lip-sync-plan.json')
          build_lip_sync_plan([{
              'index': 1, 'character': 'C1', 'start': 0.0, 'end': 1.0,
              'translation': 'Hello, how are you?'
          }], out)
          assert out.exists() and 'provider-neutral-preparation' in out.read_text()
          print('Lip-sync preparation smoke test passed')
          PY
