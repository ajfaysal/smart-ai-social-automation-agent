name: Real Media Validation

on:
  workflow_dispatch:

jobs:
  real-media-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart requests numpy opencv-python-headless pytest
      - name: Validate real media boundary
        env:
          RUN_REAL_MEDIA_VALIDATION: '1'
        run: python -m pytest -q tests/test_real_media_validation.py
