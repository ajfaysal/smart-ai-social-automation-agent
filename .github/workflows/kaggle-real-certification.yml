name: Kaggle Real Certification Dispatch

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Public video URL used as runtime input
        required: true
        default: https://drive.google.com/file/d/1brOpsZOsoM2oWijxbYyHKDlDrsQTnO7-/view?usp=drivesdk
        type: string
      language:
        description: V1 target language
        required: true
        default: Bangla
        type: choice
        options:
          - Bangla
          - English
          - Hindi
      kernel_slug:
        description: Optional private Kaggle kernel slug suffix
        required: false
        default: drama-dubbing-certification
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI and pipeline dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud-runner.txt
      - name: Validate dispatch inputs
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          TARGET_LANGUAGE: ${{ inputs.language }}
        run: |
          python - <<'PY'
          import os
          from real_run_preflight import build_preflight
          p = build_preflight(
              video_url=os.environ["VIDEO_URL"],
              target_language=os.environ["TARGET_LANGUAGE"],
              require_openai=False,
              require_wav2lip=False,
              require_diarization=False,
              require_reference_voice=False,
          )
          print(p)
          if not p.ready:
              raise SystemExit(2)
          PY
      - name: Dispatch private Kaggle GPU kernel
        id: dispatch
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          VIDEO_URL: ${{ inputs.video_url }}
          TARGET_LANGUAGE: ${{ inputs.language }}
          KERNEL_SLUG: ${{ inputs.kernel_slug }}
        run: |
          set +e
          echo "Kaggle CLI version:"
          python -m kaggle --version
          echo "Dispatch metadata: kernel-slug=$KERNEL_SLUG language=$TARGET_LANGUAGE"
          echo "KAGGLE_API_TOKEN is present: $([ -n "$KAGGLE_API_TOKEN" ] && echo yes || echo no)"
          echo "Running dispatch command with stdout/stderr capture..."
          python kaggle_gpu_orchestrator.py             --video-url "$VIDEO_URL"             --language "$TARGET_LANGUAGE"             --kernel-slug "$KERNEL_SLUG"             --dispatch-only             >"$RUNNER_TEMP/kaggle-dispatch.log" 2>&1
          status=$?
          echo "===== Kaggle dispatch diagnostic log ====="
          cat "$RUNNER_TEMP/kaggle-dispatch.log"
          echo "===== End Kaggle dispatch diagnostic log ====="
          if [ "$status" -ne 0 ]; then
            echo "Kaggle dispatch failed with exit code $status"
            exit "$status"
          fi

          kernel_url="$(grep -Eo 'https://www\.kaggle\.com/code/[^[:space:]]+/[^[:space:]]+' "$RUNNER_TEMP/kaggle-dispatch.log" | tail -n 1)"
          if [ -z "$kernel_url" ]; then
            echo "Could not determine the actual Kaggle kernel URL from push output"
            exit 3
          fi
          kernel_ref="$(printf '%s' "$kernel_url" | sed -E 's#https://www\.kaggle\.com/code/([^/]+)/([^/]+).*#\1/\2#')"
          case "$kernel_ref" in
            */"$KERNEL_SLUG") ;;
            *)
              echo "Kaggle push returned unexpected kernel ref: $kernel_ref"
              exit 4
              ;;
          esac
          echo "Actual Kaggle kernel ref: $kernel_ref"
          echo "kernel_ref=$kernel_ref" >> "$GITHUB_OUTPUT"
      - name: Publish dispatch metadata
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          TARGET_LANGUAGE: ${{ inputs.language }}
          KERNEL_SLUG: ${{ inputs.kernel_slug }}
          KERNEL_REF: ${{ steps.dispatch.outputs.kernel_ref }}
        run: |
          mkdir -p validation-artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path

          slug = os.environ["KERNEL_SLUG"]
          kernel_ref = os.environ["KERNEL_REF"]
          Path("validation-artifacts/kaggle-dispatch.json").write_text(
              json.dumps({
                  "status": "submitted",
                  "language": os.environ["TARGET_LANGUAGE"],
                  "kernel_slug": slug,
                  "kernel_ref": kernel_ref,
                  "video_url": os.environ["VIDEO_URL"],
                  "certification_status": "pending_kaggle_execution",
                  "retrieve_command": f"python kaggle_certification_operator.py {kernel_ref} --timeout 3600 --poll 30 --output-dir kaggle-certification-output",
                  "note": "Submission is not certification; certification.json is authoritative only after the Kaggle kernel completes.",
              }, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Upload dispatch metadata
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-certification-dispatch
          path: validation-artifacts/kaggle-dispatch.json
      - name: Wait for Kaggle certification
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: ${{ steps.dispatch.outputs.kernel_ref }}
        run: |
          python kaggle_certification_operator.py "$KERNEL_REF"             --timeout 3600             --poll 30             --output-dir kaggle-certification-output
      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-real-certification
          path: kaggle-certification-output/
          if-no-files-found: warn
