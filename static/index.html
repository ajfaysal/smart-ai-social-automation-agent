<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drama Dubbing Tool</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:32px;background:#0b1020;color:#eef}main{background:#151c32;padding:28px;border-radius:18px}input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #39435f;background:#0f1528;color:#fff;box-sizing:border-box}button{background:#6d5dfc;border:0;font-weight:700;cursor:pointer}small{color:#aeb7d0}#status{margin-top:16px;white-space:pre-wrap}a{color:#9d91ff}</style></head><body><main><h1>🎙️ Drama Dubbing Tool</h1><p>Upload a drama clip, translate its dialogue, and generate a dubbed audio track.</p><form id="form"><input name="video" type="file" accept="video/*" required><select name="target_language"><option>English</option><option>Bangla</option><option>Hindi</option><option>Spanish</option><option>Arabic</option><option>French</option><option>German</option><option>Portuguese</option><option>Indonesian</option><option>Urdu</option><option>Tamil</option><option>Telugu</option></select><select name="voice"><option value="alloy">Alloy</option><option value="echo">Echo</option><option value="fable">Fable</option><option value="onyx">Onyx</option><option value="nova">Nova</option><option value="shimmer">Shimmer</option></select><button>Generate Dub</button></form><div id="status"></div></main><script>form.onsubmit=async e=>{e.preventDefault();status.textContent='Uploading and dubbing... This may take a while.';try{let r=await fetch('/api/dub',{method:'POST',body:new FormData(form)}),j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');status.innerHTML=`Done. <a href="${j.download_url}">Download dubbed video</a>`}catch(x){status.textContent='Error: '+x.message}}</script></body></html>
